[[permission]]
identifier = "controls"
description = "Control dictation and read or copy the latest history text on the island."
commands.allow = ["get_status", "toggle", "get_latest_history_message", "copy_history_message"]

[[permission]]
identifier = "overlay"
description = "Read state, finish/cancel the active dictation operation or copy its result."
commands.allow = ["get_status", "toggle", "cancel_operation", "copy_result"]

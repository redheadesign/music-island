name: Stage Music Island 3.3.0 from the approved Windows build
on: workflow_dispatch
permissions:
  actions: read
  contents: write
jobs:
  stage:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PACKAGE_COMMIT: 16749c9c5454b9dd304df00a67ae991df8f646ff
      SOURCE_RUN: '46030743602'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 16749c9c5454b9dd304df00a67ae991df8f646ff
          persist-credentials: false
      - name: Retrieve the already verified official portable artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $route = "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN"
          $source = gh api $route | ConvertFrom-Json
          if ($source.path -ne '.github/workflows/portable-windows.yml' -or $source.head_sha -cne $env:PACKAGE_COMMIT) { throw 'Unexpected source build' }
          $jobs = (gh api "$route/attempts/1/jobs?per_page=100" | ConvertFrom-Json).jobs
          foreach ($name in @('Build portable Windows x64 EXE','Check components and native behavior','Verify Windows GigaAM inference (gigaam-v4-rnnt)','Verify Windows GigaAM inference (gigaam-multilingual-v2-rnnt)')) {
            if (@($jobs | Where-Object { $_.name -ceq $name -and $_.conclusion -eq 'success' }).Count -ne 1) { throw "Missing verified job: $name" }
          }
          gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name music-island-windows-x64-80 --dir "$env:RUNNER_TEMP/app-release"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Stage the approved EXE, notices and checksum with English release notes
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath "$env:RUNNER_TEMP/app-release/release/music-island.exe"
          if ($exe.VersionInfo.ProductVersion -cne '3.3.0' -or (Get-FileHash $exe.FullName).Hash -ne '0bdf084e1c440459297066f3a7268158d43e2193652fe6556bc27ab317cd5bf6') { throw 'Version or digest differs from the tested executable' }
          if ((git rev-parse HEAD) -cne $env:PACKAGE_COMMIT) { throw 'Release notes must come from the build commit' }
          $env:GITHUB_SHA = $env:PACKAGE_COMMIT
          python scripts/stage-app-release.py "$env:RUNNER_TEMP/app-release" 3.3.0
          exit $LASTEXITCODE

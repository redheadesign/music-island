name: Build Music Island for Windows

on:
  workflow_dispatch:
    inputs:
      desktop_artifact_run:
        description: Replay desktop QA on a successful official portable build from this run ID
        required: false
        type: string
      gigaam_models_run:
        description: Model asset workflow run ID for CPU inference verification
        required: false
        type: string
      gigaam_model_draft:
        description: Stage and verify the 26 model assets in a draft after Windows inference passes
        required: false
        type: boolean
        default: false
      hover_benchmark:
        description: Compare 200 native hovers each, including model workloads, against 3.2.2
        required: false
        type: boolean
        default: false
      gigaam_public_smoke:
        description: Install and cold-load both GigaAM models through the candidate's public catalog
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  desktop-source:
    name: Validate desktop replay source
    if: ${{ inputs.desktop_artifact_run != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      number: ${{ steps.source.outputs.number }}
      sha: ${{ steps.source.outputs.sha }}
      job_url: ${{ steps.source.outputs.job_url }}
    steps:
      - id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.desktop_artifact_run }}
          DESKTOP_QA: ${{ inputs.hover_benchmark || inputs.gigaam_public_smoke }}
          MODEL_DRAFT: ${{ inputs.gigaam_model_draft }}
          MODELS_RUN: ${{ inputs.gigaam_models_run }}
        run: |
          if [[ ! "$SOURCE_RUN" =~ ^[0-9]+$ || "$DESKTOP_QA" != true || "$MODEL_DRAFT" == true || -n "$MODELS_RUN" ]]; then
            echo "::error::Desktop replay requires hover or public model QA and cannot prepare a model draft or run model export verification."
            exit 1
          fi
          route="repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN"
          source=$(gh api "$route")
          jq -e --arg repo "$GITHUB_REPOSITORY" '.path == ".github/workflows/portable-windows.yml"
            and .head_repository.full_name == $repo and (.head_sha | test("^[0-9a-f]{40}$"))' <<< "$source"
          job_url=$(gh api "$route/jobs?per_page=100" | jq -er '[.jobs[] | select(.name == "Build portable Windows x64 EXE"
            and .status == "completed" and .conclusion == "success")] |
            if length == 1 then .[0].html_url else error("Expected one successful official portable build job") end')
          echo "number=$(jq -r .run_number <<< "$source")" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .head_sha <<< "$source")" >> "$GITHUB_OUTPUT"
          echo "job_url=$job_url" >> "$GITHUB_OUTPUT"

  verify:
    if: ${{ inputs.desktop_artifact_run == '' }}
    name: Check components and native behavior
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTUP_TOOLCHAIN: 1.96.1-x86_64-pc-windows-msvc
    steps:
      - name: Check the model draft input
        if: ${{ inputs.gigaam_model_draft && inputs.gigaam_models_run == '' }}
        shell: pwsh
        run: throw 'gigaam_model_draft requires the successful model export run ID in gigaam_models_run'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Install project dependencies
        run: npm ci
      - name: Check frontend and shared components
        shell: pwsh
        run: |
          foreach ($task in @('test', 'lint', 'check:tokens', 'check:storybook', 'build', 'build-storybook', 'test:workshop')) {
            npm run $task
            if ($LASTEXITCODE -ne 0) { throw "Frontend check failed ($task)" }
          }
      - name: Upload workshop evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workshop-results
          path: .local/workshop-audit/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Test native libraries
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --workspace --lib -j 2

  portable:
    if: ${{ inputs.desktop_artifact_run == '' }}
    name: Build portable Windows x64 EXE
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.96.1-x86_64-pc-windows-msvc
      CARGO_INCREMENTAL: '0'
      VULKAN_SDK_VERSION: 1.4.309.0
      ONNX_RUNTIME_VERSION: 1.24.2
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          package-manager-cache: false

      - name: Record starting disk space
        run: |
          $drive = Get-PSDrive -Name (Get-Location).Drive.Name
          'Free before installing build dependencies: {0:N2} GiB' -f ($drive.Free / 1GB)

      - name: Set up Rust and Visual Studio C++
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio 2022 C++ tools are required' }
          $cmake = Join-Path $vs 'Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin/cmake.exe'
          if (!(Test-Path -LiteralPath $cmake -PathType Leaf)) { throw 'Visual Studio CMake is required' }
          Add-Content $env:GITHUB_ENV "VSINSTALLDIR=$vs"
          Add-Content $env:GITHUB_ENV "CMAKE=$cmake"

      - name: Install the Vulkan SDK and ONNX Runtime for dictation
        run: |
          function Get-VerifiedDownload($url, $destination, $sha256) {
            curl.exe --fail --silent --show-error --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 300 --output $destination $url
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $url" }
            if ((Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash -ne $sha256) {
              throw "SHA256 mismatch: $url"
            }
          }

          $vulkanVersion = $env:VULKAN_SDK_VERSION
          $vulkanFile = "VulkanSDK-$vulkanVersion-Installer.exe"
          $installer = Join-Path $env:RUNNER_TEMP $vulkanFile
          $vulkan = Join-Path $env:RUNNER_TEMP 'vulkan-sdk'
          Get-VerifiedDownload "https://sdk.lunarg.com/sdk/download/$vulkanVersion/windows/$vulkanFile" `
            $installer '48b132169b64fe65cdb0f20970195335a65354e73f1ea5373032c2a8bbad4297'
          $install = Start-Process -FilePath $installer -WindowStyle Hidden -Wait -PassThru `
            -ArgumentList @('--root', ('"{0}"' -f $vulkan), '--accept-licenses', '--default-answer', '--confirm-command', 'install', 'copy_only=1')
          if ($install.ExitCode -ne 0) { throw "Vulkan SDK installation failed: $($install.ExitCode)" }
          Remove-Item -LiteralPath $installer
          foreach ($required in @('Bin/glslc.exe', 'Lib/cmake/SPIRV-HeadersConfig.cmake')) {
            if (!(Test-Path -LiteralPath (Join-Path $vulkan $required))) { throw "Missing Vulkan SDK file: $required" }
          }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$vulkan"

          $ortVersion = $env:ONNX_RUNTIME_VERSION
          $ortPackage = "microsoft.ml.onnxruntime"
          $archive = Join-Path $env:RUNNER_TEMP "$ortPackage.$ortVersion.nupkg"
          Get-VerifiedDownload "https://api.nuget.org/v3-flatcontainer/$ortPackage/$ortVersion/$ortPackage.$ortVersion.nupkg" `
            $archive '782564d3d68e87269ea1812cc94710ad06fe014faf093f01a6f89d0bd58719d3'
          $ort = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "ort-win-x64-$ortVersion") -Force
          $package = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            foreach ($file in @('onnxruntime.dll', 'onnxruntime.lib', 'onnxruntime_providers_shared.dll', 'onnxruntime_providers_shared.lib')) {
              $entry = $package.GetEntry("runtimes/win-x64/native/$file")
              if (!$entry) { throw "Missing Microsoft ONNX Runtime asset: $file" }
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $ort.FullName $file), $true)
            }
          } finally { $package.Dispose() }
          Remove-Item -LiteralPath $archive
          Add-Content $env:GITHUB_ENV "ORT_LIB_LOCATION=$($ort.FullName)"

      - name: Build the portable application
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run tauri:build
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }
          git diff --exit-code -- package-lock.json src-tauri/Cargo.lock src-tauri/crates/dictation-runtime/Cargo.lock

      - name: Verify the portable EXE and smoke test the bundled dictation engine
        timeout-minutes: 3
        run: |
          $exe = Get-Item -LiteralPath 'release/music-island.exe'
          $sha256 = (Get-FileHash -LiteralPath $exe.FullName).Hash.ToLowerInvariant()
          if ((Get-Content -LiteralPath 'release/SHA256.txt' -Raw).Trim() -cne "$sha256  music-island.exe") {
            throw 'Portable EXE SHA256 does not match SHA256.txt'
          }
          $version = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          if ($exe.VersionInfo.ProductVersion -ne $version) { throw 'EXE version does not match package.json' }

          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'dictation-probe/roaming'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'dictation-probe/local'
          New-Item -ItemType Directory -Path $env:APPDATA, $env:LOCALAPPDATA -Force | Out-Null
          $probe = Start-Process -FilePath $exe.FullName -ArgumentList '--dictation-runtime-check' `
            -WindowStyle Hidden -Wait -PassThru
          $report = Get-Content -LiteralPath (Join-Path $env:APPDATA 'Music Island/dictation/runtime-check.json') -Raw
          Write-Output $report
          if ($probe.ExitCode -ne 0 -or ($report | ConvertFrom-Json).vad -ne 'passed') {
            throw 'Bundled dictation engine did not pass the VAD probe'
          }
          Add-Content $env:GITHUB_STEP_SUMMARY "Music Island $version (Windows x64) — $($exe.Length) bytes"
          Add-Content $env:GITHUB_STEP_SUMMARY "`nSHA256: $sha256"

      - name: Upload portable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: music-island-windows-x64-${{ github.run_number }}
          path: |
            release/music-island.exe
            release/SHA256.txt
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 7

      - name: Record ending disk space
        if: always()
        run: |
          $drive = Get-PSDrive -Name (Get-Location).Drive.Name
          'Free after build: {0:N2} GiB' -f ($drive.Free / 1GB)

  gigaam-speech:
    name: Prepare GigaAM language references
    if: ${{ inputs.desktop_artifact_run == '' && inputs.gigaam_models_run != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: gigaam-v4-rnnt
            locales: ru_ru en_us
          - id: gigaam-multilingual-v2-rnnt
            locales: kk_kz de_de
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the tested model and public FLEURS clips
        env:
          GH_TOKEN: ${{ github.token }}
          MODELS_RUN: ${{ inputs.gigaam_models_run }}
          MODEL_ID: ${{ matrix.id }}
        run: |
          [[ "$MODELS_RUN" =~ ^[0-9]+$ ]]
          gh run download "$MODELS_RUN" --name "$MODEL_ID" --dir model
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python scripts/gigaam/speech_fixtures.py speech
      - name: Compute independent formatted transcripts
        env:
          MODEL_ID: ${{ matrix.id }}
          LOCALES: ${{ matrix.locales }}
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0
          python -m pip install -r scripts/gigaam/requirements.txt
          for locale in $LOCALES; do
            language=${locale%_*}
            if [[ "$MODEL_ID" == gigaam-v4-rnnt ]]; then language=auto; fi
            python scripts/gigaam/reference.py --pack "model/$MODEL_ID" --wav "speech/$locale.wav" --cache checkpoints --language "$language" --output "speech/$locale.reference.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.id }}-public-speech
          path: speech/
          if-no-files-found: error
          retention-days: 7

  gigaam:
    name: Verify Windows GigaAM inference
    if: ${{ inputs.desktop_artifact_run == '' && inputs.gigaam_models_run != '' }}
    needs: [portable, gigaam-speech]
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        id: [gigaam-v4-rnnt, gigaam-multilingual-v2-rnnt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the matching independent Windows reference runtime
        run: python -m pip install onnxruntime==1.24.2 numpy==2.5.5 sentencepiece==0.2.3
      - name: Download the candidate and model pack
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MODELS_RUN: ${{ inputs.gigaam_models_run }}
          MODEL_ID: ${{ matrix.id }}
        run: |
          if ($env:MODELS_RUN -notmatch '^\d+$') { throw 'Invalid model workflow run ID' }
          gh run download $env:GITHUB_RUN_ID --name "music-island-windows-x64-$env:GITHUB_RUN_NUMBER" --dir "$env:RUNNER_TEMP/exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh run download $env:MODELS_RUN --name $env:MODEL_ID --dir "$env:RUNNER_TEMP/model"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh run download $env:GITHUB_RUN_ID --name "$env:MODEL_ID-public-speech" --dir "$env:RUNNER_TEMP/speech"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          curl.exe -fsSL --retry 3 -o "$env:RUNNER_TEMP/example.wav" https://cdn.chatwm.opensmodel.sberdevices.ru/GigaAM/example.wav
          exit $LASTEXITCODE
      - name: Verify batch and streaming against golden transcripts
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $exe = @(Get-ChildItem "$env:RUNNER_TEMP/exe" -Recurse -Filter music-island.exe -File)
          if ($exe.Count -ne 1) { throw 'Expected one portable EXE' }
          ./scripts/gigaam/verify-windows.ps1 -Exe $exe[0].FullName -PackageArtifact "$env:RUNNER_TEMP/model" -Wav "$env:RUNNER_TEMP/example.wav" -FixtureDirectory "$env:RUNNER_TEMP/speech" -WorkingDirectory "$env:RUNNER_TEMP/qa"
      - name: Upload native inference evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.id }}-windows-check
          path: |
            ${{ runner.temp }}/qa/*/Music Island/dictation/runtime-check.json
            ${{ runner.temp }}/qa/*-references/*.json
          retention-days: 7
          if-no-files-found: warn

  gigaam-draft:
    name: Stage verified GigaAM model draft
    if: ${{ inputs.desktop_artifact_run == '' && inputs.gigaam_model_draft && inputs.gigaam_models_run != '' }}
    needs: [verify, gigaam]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    concurrency:
      group: gigaam-2026-11-model-draft
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify model provenance and stage the tested catalog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODELS_RUN: ${{ inputs.gigaam_models_run }}
        run: |
          [[ "$MODELS_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MODELS_RUN" | jq -e \
            '.path == ".github/workflows/gigaam-models.yml" and .status == "completed" and .conclusion == "success"'
          for model in gigaam-v4-rnnt gigaam-multilingual-v2-rnnt; do
            gh run download "$MODELS_RUN" --name "$model" --dir "$RUNNER_TEMP/packs/$model"
          done
          python3 scripts/gigaam/catalog.py "$RUNNER_TEMP/packs" --stage "$RUNNER_TEMP/outgoing" --draft

  hover:
    name: Exercise the portable application on a disposable Windows runner
    if: >-
      ${{ !cancelled() && (inputs.hover_benchmark || inputs.gigaam_public_smoke)
          && ((inputs.desktop_artifact_run != '' && needs['desktop-source'].result == 'success')
              || (inputs.desktop_artifact_run == '' && needs.portable.result == 'success'
                  && (!inputs.gigaam_model_draft || needs['gigaam-draft'].result == 'success'))) }}
    needs: [portable, gigaam-draft, desktop-source]
    runs-on: windows-2022
    timeout-minutes: 115
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Download the exact portable artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.desktop_artifact_run || github.run_id }}
          SOURCE_NUMBER: ${{ needs['desktop-source'].outputs.number || github.run_number }}
        run: gh run download $env:SOURCE_RUN --name "music-island-windows-x64-$env:SOURCE_NUMBER" --dir "$env:RUNNER_TEMP/hover-exe"
      - name: Download the approved 3.2.2 hover baseline
        if: ${{ inputs.hover_benchmark }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v3.2.2 --pattern music-island.exe --pattern SHA256.txt --dir "$env:RUNNER_TEMP/hover-baseline"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $baselineHash = (Get-FileHash "$env:RUNNER_TEMP/hover-baseline/music-island.exe").Hash
          if ($baselineHash -ne 'a8742a6c2ee3864e7833891d82f470879822c969a574eab16820ccd836ef41e3') { throw 'Approved 3.2.2 binary changed' }
      - name: Prepare the candidate and test tools
        shell: pwsh
        env:
          SOURCE_RUN: ${{ inputs.desktop_artifact_run || github.run_id }}
          SOURCE_SHA: ${{ needs['desktop-source'].outputs.sha || github.sha }}
          BUILD_JOB_URL: ${{ needs['desktop-source'].outputs.job_url }}
        run: |
          npm ci
          if ($LASTEXITCODE) { throw 'npm ci failed' }
          $exe = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/hover-exe" -Recurse -Filter 'music-island.exe' -File -ErrorAction Stop
          if (@($exe).Count -ne 1) { throw 'Expected one portable EXE' }
          $digest = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = (Get-Content -LiteralPath (Join-Path $exe.DirectoryName 'SHA256.txt') -Raw).Trim()
          if ($checksum -cne "$digest  music-island.exe") { throw 'Desktop artifact checksum mismatch' }
          $sourceUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN"
          $evidence = [ordered]@{
            sourceRun = $sourceUrl; sourceCommit = $env:SOURCE_SHA; harnessCommit = $env:GITHUB_SHA
            buildJob = $env:BUILD_JOB_URL; portableSha256 = $digest
          }
          $evidence | ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP/desktop-artifact-source.json"
          Add-Content $env:GITHUB_STEP_SUMMARY "Desktop QA used [portable run $env:SOURCE_RUN]($sourceUrl), commit $env:SOURCE_SHA, SHA-256 $digest. Harness commit $env:GITHUB_SHA."
          Add-Content $env:GITHUB_ENV "MUSIC_ISLAND_TEST_EXE=$($exe.FullName)"
      - name: Upload desktop replay provenance
        if: ${{ inputs.desktop_artifact_run != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-artifact-source-${{ github.run_number }}
          path: ${{ runner.temp }}/desktop-artifact-source.json
          if-no-files-found: error
          retention-days: 7
      - name: Wait for the verified model draft to be published
        if: ${{ inputs.gigaam_model_draft && inputs.gigaam_public_smoke }}
        timeout-minutes: 16
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deadline = [DateTime]::UtcNow.AddMinutes(15)
          do {
            $metadata = gh release view gigaam-2026-11 --json isDraft,isPrerelease,targetCommitish
            if ($LASTEXITCODE -eq 0) {
              $release = $metadata | ConvertFrom-Json
              if (!$release.isPrerelease -or $release.targetCommitish -ne $env:GITHUB_SHA) {
                throw 'The model release does not match the verified draft'
              }
              if (!$release.isDraft) { exit 0 }
            }
            Start-Sleep -Seconds 15
          } until ([DateTime]::UtcNow -ge $deadline)
          throw 'The verified GigaAM model draft was still private after 15 minutes'
      - name: Install, verify, load and remove the two public GigaAM packs
        if: ${{ inputs.gigaam_public_smoke }}
        shell: pwsh
        env:
          MUSIC_ISLAND_DISPOSABLE_DESKTOP: '1'
        run: |
          $file = Get-Item -LiteralPath $env:MUSIC_ISLAND_TEST_EXE
          $sha = ((Get-Content -LiteralPath (Join-Path $file.DirectoryName 'SHA256.txt') -Raw).Trim() -split '\s+')[0]
          node scripts/hover-bench/run.mjs $file.FullName $sha "$env:RUNNER_TEMP/gigaam-public" public-models
          exit $LASTEXITCODE
      - name: Upload public model results
        if: ${{ always() && inputs.gigaam_public_smoke }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gigaam-public-${{ github.run_number }}
          path: ${{ runner.temp }}/gigaam-public/report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Measure native hover and first-click delivery
        if: ${{ !cancelled() && inputs.hover_benchmark && env.MUSIC_ISLAND_TEST_EXE != '' }}
        shell: pwsh
        env:
          MUSIC_ISLAND_DISPOSABLE_DESKTOP: '1'
        run: |
          $env:MUSIC_ISLAND_HOVER_PYTHON = (Get-Command python.exe).Source
          ./scripts/hover-bench/compare.ps1 -BaselineExe "$env:RUNNER_TEMP/hover-baseline/music-island.exe" -CandidateExe $env:MUSIC_ISLAND_TEST_EXE -Output "$env:RUNNER_TEMP/hover-result"
          exit $LASTEXITCODE
      - name: Upload measured hover trials
        if: ${{ always() && inputs.hover_benchmark }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hover-results-${{ github.run_number }}
          path: ${{ runner.temp }}/hover-result/*/report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Exercise real 150 percent scale when the desktop supports it
        if: ${{ !cancelled() && inputs.hover_benchmark && env.MUSIC_ISLAND_TEST_EXE != '' }}
        shell: pwsh
        env:
          MUSIC_ISLAND_DISPOSABLE_DESKTOP: '1'
          MUSIC_ISLAND_RUNNER_TYPE: ${{ runner.environment }}
        run: |
          $scale = "$env:RUNNER_TEMP/hover-scale.json"
          ./scripts/hover-bench/set-test-display-scale.ps1 -ResultPath $scale
          $result = Get-Content -LiteralPath $scale -Raw | ConvertFrom-Json
          if (!$result.selected) {
            Write-Warning "150% coverage unavailable on this display: $($result.reason)"
            exit 0
          }
          $env:MUSIC_ISLAND_HOVER_PYTHON = (Get-Command python.exe).Source
          ./scripts/hover-bench/compare.ps1 -BaselineExe "$env:RUNNER_TEMP/hover-baseline/music-island.exe" -CandidateExe $env:MUSIC_ISLAND_TEST_EXE -Output "$env:RUNNER_TEMP/hover-150" -Dpi 144
          exit $LASTEXITCODE
      - name: Upload the measured scale change and 150 percent trials
        if: ${{ always() && inputs.hover_benchmark }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hover-150-results-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/hover-scale.json
            ${{ runner.temp }}/hover-150/*/report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Measure real streaming when a private test cable is present
        if: ${{ !cancelled() && inputs.hover_benchmark && env.MUSIC_ISLAND_TEST_EXE != '' }}
        shell: pwsh
        env:
          MUSIC_ISLAND_DISPOSABLE_DESKTOP: '1'
        run: |
          $env:MUSIC_ISLAND_HOVER_PYTHON = (Get-Command python.exe).Source
          ./scripts/hover-bench/streaming.ps1 -BaselineExe "$env:RUNNER_TEMP/hover-baseline/music-island.exe" -CandidateExe $env:MUSIC_ISLAND_TEST_EXE -Output "$env:RUNNER_TEMP/hover-streaming" -RecordUnavailable
          $resultCode = $LASTEXITCODE
          $availability = Get-Content -LiteralPath "$env:RUNNER_TEMP/hover-streaming/availability.json" -Raw | ConvertFrom-Json
          Add-Content $env:GITHUB_STEP_SUMMARY "Native streaming QA fixture: $($availability.status) $($availability.reason)"
          if ($availability.status -eq 'available') { exit $resultCode }
          if ($availability.status -eq 'unavailable') { exit 0 }
          throw 'Missing or unknown native streaming fixture status'
      - name: Upload native streaming evidence
        if: ${{ always() && inputs.hover_benchmark }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hover-streaming-results-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/hover-streaming/availability.json
            ${{ runner.temp }}/hover-streaming/trials/*/report.json
          if-no-files-found: warn
          retention-days: 7
